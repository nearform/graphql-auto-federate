name: Continuous Integration

on: 
  push:
   branches:
    - master
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: |
          npm ci
          npm run lint
          npm test

  # Stable status-check context ("Lint and test") required by branch
  # protection. A matrix always appends its values to the job name, so this
  # aggregation job preserves the single required context after the split and
  # fails if any matrix leg did not succeed.
  lint-and-test:
    name: Lint and test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix test jobs did not all succeed (result: ${{ needs.test.result }})"
            exit 1
          fi

  automerge:
    name: Merge dependabot's PRs
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
